services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neoncrate
      POSTGRES_PASSWORD: neoncrate
      POSTGRES_DB: neoncrate
    ports:
      - '5432:5432'
    volumes:
      - neoncrate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neoncrate']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - neoncrate_redisdata:/data

volumes:
  neoncrate_pgdata:
  neoncrate_redisdata:
